# Hyprland entrypoint — Lua config handles everything else
# exec-once here as reliable fallback for autostart
preload = /home/nico/Pictures/catto.jpg
wallpaper = eDP-1,/home/nico/Pictures/catto.jpg
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle


# Layer rules for glass/blur effects
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, mako
layerrule = ignorezero, mako

