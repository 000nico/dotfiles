background {
    monitor =
    path = /home/nico/Pictures/catto.jpg
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.25
    vibrancy_darkness = 0.1
}

# Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(ffb040ee)
    inner_color = rgba(10, 7, 4, 0.85)
    font_color = rgb(245, 223, 200)
    fade_on_empty = true
    placeholder_text = <span foreground="##c8a888"><i>Enter password...</i></span>
    hide_input = false
    rounding = 12
    check_color = rgb(255, 176, 64)
    fail_color = rgb(232, 64, 64)
    fail_text = <i>Failed attempt ($ATTEMPTS)</i>
    position = 0, -90
    halign = center
    valign = center
}

# Time (Hours & Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 176, 64, 0.95)
    font_size = 84
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 190
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(245, 223, 200, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 110
    halign = center
    valign = center
}

# User badge / greeting
label {
    monitor =
    text = cmd[update:10000] echo "CachyOS • $USER"
    color = rgba(200, 168, 136, 0.6)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}

