"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = true

format = """
[╭─](grey)\
[ $directory ](bold blue)\
$git_branch$git_status$git_state\
$python$nodejs$rust$golang$lua$docker_context$package\
$cmd_duration$time\
\n[╰─](grey)[❯](blue) """

right_format = ""

[palettes.kitty]
blue = "#a8c8ff"
lavender = "#dcbce1"
grey = "#8e9099"
text = "#e2e2e9"
red = "#ffb4ab"
muted = "#bdc7dc"

[directory]
style = "bold blue"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "lavender"
format = "[ $branch ]($style)"
symbol = ""

[git_status]
style = "muted"
format = '([$all_status$ahead_behind ]($style))'
conflicted = "!"
ahead = "↑"
behind = "↓"
diverged = "⇕"
untracked = "?"
modified = "*"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
style = "grey"
format = '[$state( $progress_current/$progress_total)]($style)'

[cmd_duration]
min_time = 2000
style = "grey"
format = "[ took $duration ]($style)"

[time]
disabled = false
style = "grey"
format = "[$time ]($style)"
time_format = "%H:%M"

[python]
style = "lavender"
format = '[ py $version ]($style)'

[nodejs]
style = "lavender"
format = '[ node $version ]($style)'

[rust]
style = "lavender"
format = '[ rs $version ]($style)'

[golang]
style = "lavender"
format = '[ go $version ]($style)'

[lua]
style = "lavender"
format = '[ lua $version ]($style)'

[docker_context]
style = "lavender"
format = '[ docker $context ]($style)'

[package]
style = "lavender"
format = '[ pkg $version ]($style)'

[username]
disabled = true

[hostname]
disabled = true

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

[status]
disabled = false
style = "red"
format = "[$status ]($style)"

