font_family BigBlueTermPlus Nerd Font Mono
font_size 11.0
shell /usr/bin/fish
window_padding_width 12
background_opacity 1.0
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_trail 3
cursor_trail_decay 0.1 0.5
cursor_trail_start_threshold 0
cursor_trail_color #a8c8ff
cursor_blink_interval 0
repaint_delay 6

input_delay 1
sync_to_monitor yes
scrollback_lines 10000
background #050507
foreground #e2e2e9
selection_background #bdc7dc
selection_foreground #273141
cursor #a8c8ff
url_color #a8c8ff
color0 #0c0e13
color1 #ffb4ab
color2 #dcbce1
color3 #a8c8ff
color4 #bdc7dc
color5 #dcbce1
color6 #bdc7dc
color7 #e2e2e9
color8 #8e9099
color9 #ffb4ab
color10 #dcbce1
color11 #a8c8ff
color12 #bdc7dc
color13 #dcbce1
color14 #bdc7dc
color15 #e2e2e9
cursor_beam_thickness 3.5
include themes/noctalia.conf
