# Umbriel config — migrated from mango
# Nico's setup

# ==============================================================================
# Outputs
[output.eDP-1]
scale = 1.3

# ==============================================================================
# General

[general]
autostart = ["dbus-update-activation-environment --all", "pipewire", "noctalia", "kitty --single-instance --start-as=hidden"]
# Sin el cartel de atajos al iniciar sesión.
show_cheatsheet = false

# ==============================================================================
# Input

[input.keyboard]
numlock_toggle = true
repeat_rate = 25
repeat_delay = 600
layout = "us"

[input.touchpad]
tap = true
tap_and_drag = true
drag_lock = "sticky"
natural_scroll = false
disable_while_typing = true

[input.mouse]
natural_scroll = false

# Foco sigue al mouse (sloppy focus: la ventana bajo el cursor toma el foco
# al pasar por encima, sin necesidad de clickear).
[input.focus]
follows_mouse = true

# ==============================================================================
# Appearance
#
# Mango values:
#   gap_inner = 6, gap_outer = 14
#   border_px = 2, border_radius = 0
#   focused_opacity = 0.93, unfocused_opacity = 0.86
#   root_color = 0x111318ff
#   border_color = 0x333333ff, focus_color = 0x555555ff

[appearance]
# Borde dibujado dentro de la ventana (no ocupa espacio extra del layout).
border_width = 2
corner_radius = 0

# Blur (mango: blur=1, blur_layer=1, optimized, passes=2, radius=4)
[appearance.blur]
radius = 4
passes = 2
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.2

# Shadows
[appearance.shadow]
enabled = false
offset_x = 0
offset_y = 0

# ==============================================================================
# Effects
[effects.preset.dim]
kind = "window"
shader = "/home/nico/.local/share/umbriel/effects/window/dim/shader.glsl"

# ==============================================================================
# Colors
[colors]
backdrop = "#111318FF"

[colors.border]
focused = "#333333FF"
unfocused = "#333333FF"

# ==============================================================================
# Layout — dwindle (Hyprland-like tiling)
[layout]
mode = "dwindle"
gap = 6
extent_presets = [0.333, 0.5, 0.667]

[layout.dwindle]
preserve_split = true

# ==============================================================================
# Overview
# mango: hotarea disabled (enable_hotarea=0)
[hot_corners.top_left]
enabled = false

# ==============================================================================
# Keybinds
# Mapped 1-to-1 from mango config.conf
[keybinds]

# Reload config (mango: SUPER+SHIFT,r,reload_config)
"Super+Shift+R" = "config-reload"

# Terminal (mango: SUPER,c → open-kitty)
"Super+C" = { action = "spawn /home/nico/.local/bin/open-kitty", repeat = false }

# File Manager
"Super+E" = { action = "spawn pcmanfm", repeat = false }

# Launcher (mango: SUPER,r → noctalia panel-toggle launcher)
"Super+R" = "spawn noctalia msg panel-toggle launcher"

# Wallpaper picker (mango: SUPER,w → noctalia panel-toggle wallpaper)
"Super+W" = "spawn noctalia msg panel-toggle wallpaper"

# Screenshots (mango: Print → region, SUPER+Print → fullscreen)
"Print" = "spawn noctalia msg screenshot-region"
"Super+Print" = "spawn noctalia msg screenshot-fullscreen"

# Quit session (mango: SUPER,m)
"Super+M" = "session-quit"

# Close window (mango: SUPER,q)
"Super+Q" = { action = "window-close", repeat = false }

# Focus direction (mango: SUPER+arrows and ALT+arrows)
"Super+Tab" = "window-focus-next"
"Super+Left" = "window-focus-left"
"Super+Right" = "window-focus-right"
"Super+Up" = "window-focus-up"
"Super+Down" = "window-focus-down"
"Alt+Left" = "window-focus-left"
"Alt+Right" = "window-focus-right"
"Alt+Up" = "window-focus-up"
"Alt+Down" = "window-focus-down"

# Move window (mango: SUPER+SHIFT+arrows)
"Super+Shift+Up" = "window-move-up"
"Super+Shift+Down" = "window-move-down"
"Super+Shift+Left" = "column-move-left"
"Super+Shift+Right" = "column-move-right"

# Window state toggles
"Alt+backslash" = { action = "window-toggle-floating", repeat = false }
"Super+V" = { action = "window-toggle-floating", repeat = false }
"Alt+A" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Alt+F" = { action = "window-toggle-fullscreen", repeat = false }
"Super+Alt+V" = "layout-toggle-split"

# Resize window (Ctrl+Alt+Arrows)
# En el layout dwindle las columnas no se pueden redimensionar por borde:
# se cambia el "extent" primario (ancho) y secundario (alto) del área.
"Ctrl+Alt+Left" = "window-modify-primary-extent -0.05"
"Ctrl+Alt+Right" = "window-modify-primary-extent 0.05"
"Ctrl+Alt+Up" = "window-modify-secondary-extent -0.05"
"Ctrl+Alt+Down" = "window-modify-secondary-extent 0.05"

# Scratchpad (mango: ALT+z → toggle_scratchpad)
"Alt+Z" = "scratchpad-toggle"

# Switch layout (mango: SUPER+n)
"Super+N" = "workspace-set-layout toggle scrolling master dwindle"

# Workspace switch (mango: SUPER+1..9 → view)
"Super+1" = "workspace-switch 1"
"Super+2" = "workspace-switch 2"
"Super+3" = "workspace-switch 3"
"Super+4" = "workspace-switch 4"
"Super+5" = "workspace-switch 5"
"Super+6" = "workspace-switch 6"
"Super+7" = "workspace-switch 7"
"Super+8" = "workspace-switch 8"
"Super+9" = "workspace-switch 9"

# Move window to workspace (mango: ALT+1..9 → tag)
"Alt+1" = "window-move-to-workspace 1"
"Alt+2" = "window-move-to-workspace 2"
"Alt+3" = "window-move-to-workspace 3"
"Alt+4" = "window-move-to-workspace 4"
"Alt+5" = "window-move-to-workspace 5"
"Alt+6" = "window-move-to-workspace 6"
"Alt+7" = "window-move-to-workspace 7"
"Alt+8" = "window-move-to-workspace 8"
"Alt+9" = "window-move-to-workspace 9"

# Navigate workspaces with arrows (mango: SUPER+CTRL+Left/Right)
"Super+Ctrl+Left" = "workspace-previous"
"Super+Ctrl+Right" = "workspace-next"
# Move window to adjacent workspace (mango: SUPER+CTRL+SHIFT+Left/Right)
"Super+Ctrl+Shift+Left" = "window-move-to-workspace-previous"
"Super+Ctrl+Shift+Right" = "window-move-to-workspace-next"

# Monitor focus (mango: ALT+SHIFT+Left/Right → focusmon)
"Alt+Shift+Left" = "output-focus-left"
"Alt+Shift+Right" = "output-focus-right"

# Move window to monitor (mango: SUPER+ALT+Left/Right → tagmon)
"Super+Alt+Left" = "column-move-to-output-left"
"Super+Alt+Right" = "column-move-to-output-right"

# Overview (mango: SUPER,o → toggleoverlay)
"Super+O" = { action = "overview-toggle", repeat = false }

# Mouse bindings (mango: SUPER+btn_left → move, SUPER+btn_right → resize)
"Super+MouseLeft" = "layout-scroll-drag"

# Media keys (routed through noctalia)
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Scroll wheel workspace navigation (mango: SUPER+wheel)
"Super+WheelUp" = "workspace-previous"
"Super+WheelDown" = "workspace-next"

# ==============================================================================
# Window rules

# Global blur
[[window_rule]]
blur = false

# Dim unfocused windows (oscurecer ventanas sin foco en lugar de transparentarlas)
[[window_rule]]
match.is_focused = true
window_effect = "off"

[[window_rule]]
match.is_focused = false
window_effect = "dim"

# Noctalia floating
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

# Feh image viewer floating
[[window_rule]]
match.app_id = "^(feh|FEH)$"
default_floating = true

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# ==============================================================================
# Layer rules

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

[include]
files = []
