# ==============================================================================
# Tmux Minimalist Setup
# Colors matched to Kitty theme:
#   bg: #111318
#   fg: #e2e2e9
# ==============================================================================

# Terminal & Shell
set -g default-shell /usr/bin/fish
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -s escape-time 0
set -g mouse on

# Marco interior minimalista
set -g status-position top
set -g status-left ""
set -g status-right "▪ ▪ ▪ "

# Colores de la barra de estado
set -g status-style "bg=#111318,fg=#e2e2e9"
set -g status-right-style "bg=#111318,fg=#e2e2e9"

# Bordes de panel (marco interior)
set -g pane-border-status top
set -g pane-border-format ""
set -g pane-border-style "fg=#333333,bg=#111318"
set -g pane-active-border-style "fg=#e2e2e9,bg=#111318"

# Estilo de ventanas
set -g window-status-current-style "bg=#111318,fg=#e2e2e9,bold"
set -g window-status-style "bg=#111318,fg=#8e9099"
set -g window-status-current-format " #W "
set -g window-status-format " #W "
