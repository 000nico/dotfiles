# Fuzzel Configuration - Compact Terminal Style
font=JetBrainsMono Nerd Font:size=11
prompt="nico@nixos:~$ "
icon-theme=Papirus-Dark
icons-enabled=no
terminal=kitty -e

lines=7
width=32
tabs=4
horizontal-pad=14
vertical-pad=10
inner-pad=6
line-height=20

layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Fondo con transparencia (85% alpha -> d9)
background=080512d9
text=e9d5ffff
prompt=86efacff
placeholder=6b4fa0ff
input=e9d5ffff
match=86efacff
selection=2a1a48e6
selection-text=c084fcff
selection-match=86efacff
border=7c3aedcc

[border]
width=1
radius=0

