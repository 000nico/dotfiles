font=JetBrainsMono Nerd Font:size=11
use-bold=yes
prompt=""
icon-theme=Papirus-Dark
icons-enabled=no
terminal=kitty -e

lines=8
width=60
tabs=4
horizontal-pad=18
vertical-pad=12
inner-pad=8
line-height=22

layer=overlay
exit-on-keyboard-focus-loss=yes
keyboard-focus=exclusive
match-mode=fuzzy
delayed-filter-ms=0

[colors]
background=18202bb8
text=d5eaffff
prompt=83aeefff
placeholder=8294aaff
input=d5eaffff
match=8ecbffff
selection=294052dd
selection-text=8ecbffff
selection-match=8ecbffff
border=83aeefff

[border]
width=1
radius=0
