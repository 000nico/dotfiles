# Void-inspired theme for Ly.
# Ly's defaults remain in effect for options not listed here.
animation = dur_file
animation_frame_delay = 6
dur_file_path = /etc/ly/blackhole-smooth-240x67.dur
bg = 0x000B1210
fg = 0x00D7FFE0
border_fg = 0x0048CC88
blank_box = true
box_title = "void"
clock = "%H:%M"
full_color = true
hide_borders = false
hide_key_hints = true
hide_keyboard_locks = true
hide_version_string = true
initial_info_text = "welcome"
lang = en
margin_box_h = 3
margin_box_v = 1
show_tty = false
