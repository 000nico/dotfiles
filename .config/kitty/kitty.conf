shell fish

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0
disable_ligatures always
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 1
# --- rice: transparencia + paleta (la misma de rofi / waybar / yazi) ---
# El blur lo aplica mango (blur=1 en ~/.config/mango/config.conf), por eso
# background_blur va en 0: si no, se aplica dos veces.
background_opacity 0.94
background_blur 0
text_composition_strategy platform

foreground           #d0d0d0
background           #18181b
cursor               #c9b890
cursor_text_color    #18181b
selection_background #2f2f34
selection_foreground #d0d0d0
url_color            #c9b890
include ~/.config/kitty/matugen-colors.conf
