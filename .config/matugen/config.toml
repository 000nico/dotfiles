[config]
reload_apps = true

[templates]
waybar = { input_path = "~/.config/matugen/templates/colors.css", output_path = "~/.config/waybar/colors.css", post_hook = "~/.config/matugen/reload.sh" }
mango = { input_path = "~/.config/matugen/templates/mango-colors.conf", output_path = "~/.config/mango/matugen-colors.conf" }
rofi = { input_path = "~/.config/matugen/templates/rofi-colors.rasi", output_path = "~/.config/rofi/colors.rasi" }
mako = { input_path = "~/.config/matugen/templates/mako.conf", output_path = "~/.config/mako/config" }
kitty = { input_path = "~/.config/matugen/templates/kitty-colors.conf", output_path = "~/.config/kitty/matugen-colors.conf" }
foot = { input_path = "~/.config/matugen/templates/foot-colors.ini", output_path = "~/.config/foot/matugen-colors.ini" }
